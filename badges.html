    <!-- СТАТИСТИКА ПОСЕТИТЕЛЯ -->
    <section class="section">
        <div class="container">
            <div class="visitor-stats reveal-up" id="visitor-stats"></div>

    <!-- ПРОГРЕСС -->
    <section class="section">
        <div class="container">
            <div class="badges-progress-panel reveal-up" id="badges-progress-panel"></div>

    <!-- ФИЛЬТРЫ -->
    <section class="section">
        <div class="container">
            <div class="filters reveal-up" id="badge-filters">
                <button class="filter-btn active" data-cat="all">🏅 Все</button>

                <button class="filter-btn" data-cat="explore">🗺️ Исследование</button>

    <!-- МОДАЛКА РАЗБЛОКИРОВКИ -->
    <div class="badge-modal" id="badge-modal">
        <div class="badge-modal-content">
            <div class="badge-modal-flash"></div>
            <div class="badge-modal-particles" id="badge-modal-particles"></div>
            <div class="badge-modal-icon" id="badge-modal-icon">🏅</div>
            <div class="badge-modal-rarity" id="badge-modal-rarity">COMMON</div>
            <h2 class="badge-modal-title">Новый бейдж!</h2>
            <div class="badge-modal-name" id="badge-modal-name">Название</div>
            <p class="badge-modal-desc" id="badge-modal-desc">Описание</p>
            <button class="badge-modal-btn" id="badge-modal-close">🎉 Забрать</button>
